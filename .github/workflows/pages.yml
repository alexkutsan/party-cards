name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest is 26.04, and Playwright 1.55 does not ship a Chromium
    # build for that image. 24.04 is the newest LTS this Playwright release supports.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install smoke-test browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build site
        env:
          BASE_PATH: /party-cards/
        run: python3 build.py

      - name: Smoke test
        run: |
          python3 serve.py --port 8080 > /tmp/party-cards-serve.log 2>&1 &
          echo $! > /tmp/party-cards-serve.pid
          trap 'kill $(cat /tmp/party-cards-serve.pid) 2>/dev/null || true' EXIT
          ok=
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/party-cards/; then ok=1; break; fi
            sleep 0.2
          done
          test -n "$ok"
          node tests/smoke.mjs http://127.0.0.1:8080/party-cards/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
