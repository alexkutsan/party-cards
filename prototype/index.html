<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0d14">
<title>Игры для компании</title>
<style>
:root{--bg:#0e0d14;--bg2:#17151f;--card:#201d2b;--line:#2e2a3d;--tx:#eeeaf6;--mu:#9a93ad;--ac:#8b6cff;--ac2:#ff5fa2;--ok:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;user-select:none;-webkit-user-select:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(14,13,20,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);min-height:56px}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:44px;height:44px;border-radius:12px;font-size:24px;background:var(--bg2)}
.wrap{padding:16px 16px calc(env(safe-area-inset-bottom) + 110px);max-width:680px;margin:0 auto}
.hero{padding:10px 4px 6px}.hero h2{font-size:28px;margin:0 0 4px;line-height:1.15}.hero p{color:var(--mu);margin:0}
.sec{margin:22px 0 8px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.sec small{color:var(--mu);font-weight:400;font-size:14px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin:8px 0;border-radius:18px;background:linear-gradient(135deg,var(--card),var(--bg2));border:1px solid var(--line);min-height:64px;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(139,108,255,.15);flex:none}
.tile b{display:block;font-size:17px}.tile span{color:var(--mu);font-size:14px}
.tile.info .ic{background:rgba(255,255,255,.06)}
.tile.lock{border-color:#5a2741;background:linear-gradient(135deg,#2a1622,#1a121a)}
.x18 .ic{background:rgba(255,95,162,.18)}
.md{font-size:16.5px}.md h3{font-size:19px;margin:22px 0 6px;color:#cbbcff}.md h4{margin:18px 0 6px}
.md p{margin:10px 0}.md ul,.md ol{padding-left:22px;margin:8px 0}.md li{margin:6px 0}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--ac2);background:rgba(255,95,162,.08);border-radius:0 12px 12px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.md strong{color:#fff}.md em{color:#d9d2ea}
.md .tw{overflow-x:auto;margin:12px 0}.md table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}.md th{background:var(--bg2)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 35%);z-index:6}
.btn{display:block;width:100%;max-width:648px;margin:0 auto;padding:18px;border-radius:18px;font-size:19px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 10px 30px rgba(139,108,255,.35);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec2{background:var(--card);box-shadow:none;border:1px solid var(--line);font-size:16px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{padding:10px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:15px;min-height:44px;text-align:left}
.chip.on{background:rgba(139,108,255,.22);border-color:var(--ac);color:#fff}
.lbl{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-top:16px}
.drawzone{display:flex;flex-direction:column;align-items:center;gap:16px;margin:24px 0 10px}
.deckpile{position:relative;width:190px;height:260px}
.deckpile i{position:absolute;inset:0;border-radius:20px;background:linear-gradient(145deg,#3a2c78,#7a2d5c);border:2px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.deckpile i:nth-child(1){transform:rotate(-6deg) translate(-6px,4px);opacity:.6}.deckpile i:nth-child(2){transform:rotate(4deg) translate(5px,2px);opacity:.8}
.deckpile i:nth-child(3){display:grid;place-items:center;font-size:56px}
.bigdraw{width:100%;padding:24px;font-size:22px}
.count{color:var(--mu);font-size:15px;text-align:center}
.count b{color:var(--tx);font-size:20px}
.row{display:flex;gap:10px;margin-top:10px}.row .btn{flex:1}
.num{width:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:17px;text-align:center}
/* overlay */
#ov{position:fixed;inset:0;z-index:50;background:rgba(5,4,10,.96);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);perspective:1400px}
#ov.show{display:flex}
.flip{flex:1;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform:rotateY(180deg) scale(.92)}
#ov.open .flip{transform:rotateY(0) scale(1)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.front{background:linear-gradient(160deg,#272238,#1a1726);border:2px solid #3b3452;padding:22px 20px}
.backf{transform:rotateY(180deg);background:linear-gradient(145deg,#3a2c78,#7a2d5c);display:grid;place-items:center;font-size:80px;border:2px solid rgba(255,255,255,.15)}
.cmeta{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;gap:10px}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;padding:10px 0}
.ctext{font-size:clamp(24px,7.2vw,40px);line-height:1.3;font-weight:650;text-align:center;word-wrap:break-word}
.ctext.long{font-size:clamp(20px,5.8vw,30px)}
.slot{margin:10px 0;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);text-align:left}
.slot small{display:block;color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.slot div{font-size:clamp(20px,6vw,30px);font-weight:650;line-height:1.25}
.closebtn{margin-top:14px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:420px;width:100%;text-align:center}
.modal h3{margin:0 0 8px;font-size:24px}.modal p{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#2b2640;padding:10px 16px;border-radius:12px;z-index:70;font-size:15px}
.muted{color:var(--mu);font-size:14px}
</style></head><body>

ть:** что сказано здесь, здесь и остаётся.\n  - **Стоп-слово** «Ананас» останавливает игру для всех.\n- **Алкоголь:** в глубоких играх лучше по минимуму. Тост «за честность» между играми, 1–2 бокала за вечер."}, {"title": "Мини-сценарий (~1,5 часа)", "md": "| Время | Игра | Что происходит |\n|---|---|---|\n| 0:00–0:05 | Вступление | Правила: «пас», «глубже», конфиденциальность, стоп-слово. Чай или бокал вина |\n| 0:05–0:20 | «Зеркало» (1), раунды А и Б | Смех и первые неожиданные слова о себе |\n| 0:20–0:40 | «Горячий стул» (2), по 3 минуты на человека | Вопросы 🟢🟡 |\n| 0:40–1:00 | «Мы не чужие» (3), уровни 1–2 | Связь, вайлдкарды, первые объятия |\n| 1:00–1:20 | «36 вопросов» (5), блок III в парах + взгляд в глаза | Самый сильный момент вечера |\n| 1:20–1:30 | Финал | Записки «первое впечатление» из игры 3 + одно слово по кругу |\n\n*Вариант на длинный вечер: вставить «С чего начнём» (4) на 30–40 минут между играми 3 и 5.*"}]}, {"id": "fun", "title": "Посмеяться", "full": "Посмеяться, покринжовать, хорошо провести время", "icon": "😂", "intro": "*Пять игр, после которых болят щёки от смеха. Немного кринжа, немного импровизации, щепотка 18+ ближе к ночи. Для компании 4–12 взрослых.*", "games": [{"id": "fun1", "title": "«Кто скорее всего…» (Most Likely To)", "short": "Кто скорее всего…", "rules": "**Подготовка:** колода вопросов. Можно бумажки для тайного голосования.\n\n**Механика:**\n\n- Читающий по кругу читает карту. «Три-два-один», и все одновременно показывают пальцем на одного (на себя можно).\n- **Титул:** тот, на кого указало больше всего пальцев, получает «звезду» (жетон или стикер). При ничьей звезду получают все с равным числом голосов.\n- **Право на защиту:** «победитель» может произнести 15-секундную оправдательную речь. Если группа хлопает, звезда снимается.\n- **Вариант «Тайный суд»:** голосуют на бумажках, ведущий объявляет результат драматично, как на «Оскаре».\n- **Вариант «Объясни»:** любой голосовавший может быть вызван объяснить свой выбор одной явление по итогам брифинга».\n- 🍷 Улыбнулся, глоток и уходишь с трибуны. Выдержал 5 вопросов подряд, назначаешь глоток всей прессе. Без алкоголя: «поручение администрации» (фант).\n\n**Пример.** *«Уважаемый пресс-секретарь президента, почему у кота моей соседки три паспорта?»* → *«Спасибо за ваш вопрос. Вы спрашиваете меня, почему у кота вашей соседки три паспорта. Отвечаю по существу. В рамках программы цифровизации домашних животных каждому коту в многоквартирном доме полагается внутренний, заграничный и ветеринарный паспорт. Это обеспечивает прозрачность миграции кота между квартирами. Нарушений не усматриваем».*", "decks": [{"name": "Пресс-секретарь — Издания", "cards": [{"n": 1, "t": "«Вечерний сплетник»", "l": ""}, {"n": 2, "t": "«Вестник ЖКХ»", "l": ""}, {"n": 3, "t": "«Эротика сегодня»", "l": ""}, {"n": 4, "t": "«Голос огородника»", "l": ""}, {"n": 5, "t": "«Кошачьи новости»", "l": ""}, {"n": 6, "t": "«Правда о бывших»", "l": ""}, {"n": 7, "t": "«Комсомольская шаурма»", "l": ""}, {"n": 8, "t": "«Ведомости пенсионера»", "l": ""}, {"n": 9, "t": "«Желтуха ТВ»", "l": ""}, {"n": 10, "t": "«Журнал \"Ревнивец\"»", "l": ""}]}, {"name": "Пресс-секретарь — Вопросы 🟢 («Уважаемый пресс-секретарь президента, почему…»)", "cards": [{"n": 11, "t": "🟢 …голуби до сих пор не платят налоги?", "l": "🟢"}, {"n": 12, "t": "🟢 …пельмени лепят вручную, а совесть нет?", "l": "🟢"}, {"n": 13, "t": "🟢 …министру подали холодный борщ с мармеладом?", "l": "🟢"}, {"n": 14, "t": "🟢 …по вторникам в столице идёт снег из конфетти?", "l": "🟢"}, {"n": 15, "t": "🟢 …ваш галстук светится в темноте?", "l": "🟢"}, {"n": 16, "t": "🟢 …ёжики перестали ходить в туман?", "l": "🟢"}, {"n": 17, "t": "🟢 …лифт в парламенте поёт Аллу Пугачёву?", "l": "🟢"}, {"n": 18, "t": "🟢 …у пингвинов нет водительских прав?", "l": "🟢"}, {"n": 19, "t": "🟢 …президент вчера обнимал кактус на камеру?", "l": "🟢"}, {"n": 20, "t": "🟢 …в бюджете заложено 300 миллионов на резиновых уточек?", "l": "🟢"}, {"n": 21, "t": "🟢 …ваши носки разного еди речи адвокат и прокурор меняются позициями без паузы.\n- **Вариант «Суд присяжных»:** судья в мантии-пледе, приговор — фант.\n- **Эскалация:** 🟢 → 🟡 → 🔴.\n- **Конец:** у каждого 2–3 выступления. «Золотой язык» вечера выбирает утверждение, которое все защищают хором.\n- 🍷 Проиграл, глоток. Засмеялся во время своей речи, глоток. Единогласное 👍, назначаешь глоток любому.", "decks": [{"name": "Адвокат дьявола 🟢", "cards": [{"n": 1, "t": "🟢 Ананас на пицце — признак высокого интеллекта.", "l": "🟢"}, {"n": 2, "t": "🟢 Кошки — правительственные шпионы.", "l": "🟢"}, {"n": 3, "t": "🟢 Понедельник — лучший день недели.", "l": "🟢"}, {"n": 4, "t": "🟢 Носки с сандалиями — вершина моды.", "l": "🟢"}, {"n": 5, "t": "🟢 Мыть посуду нужно раз в неделю, это экологично.", "l": "🟢"}, {"n": 6, "t": "🟢 Взрослым нужен обязательный дневной сон.", "l": "🟢"}, {"n": 7, "t": "🟢 Опаздывать на 30 минут — проявление уважения.", "l": "🟢"}, {"n": 8, "t": "🟢 Голосовые сообщения на 5 минут — лучший способ общения.", "l": "🟢"}, {"n": 9, "t": "🟢 Майонез — это суп.", "l": "🟢"}, {"n": 10, "t": "🟢 Нельзя доверять людям, которые не любят собак.", "l": "🟢"}, {"n": 11, "t": "🟢 Земля плоская, просто у неё хороший пиар.", "l": "🟢"}, {"n": 12, "t": "🟢 Холодный чай лучше горячего кофе.", "l": "🟢"}, {"n": 13, "t": "🟢 Утренние пробежки опасны для психики.", "l": "🟢"}, {"n": 14, "t": "🟢 Голуби умнее людей.", "l": "🟢"}, {"n": 15, "t": "🟢 Новый год нужно праздновать в июле.", "l": "🟢"}, {"n": 16, "t": "🟢 Детям надо разрешить голосовать.", "l": "🟢"}, {"n": 17, "t": "🟢 Шуба из «Ералаша» — лучший фильм в истории.", "l": "🟢"}, {"n": 18, "t": "🟢 Сыр — это десерт.", "l": "🟢"}, {"n": 19, "t": "🟢 Пешеходы должны уступать дорогу самокатам.", "l": "🟢"}, {"n": 20, "t": "🟢 Офисная работа полезнее спорта.", "l": "🟢"}, {"n": 21, "t": "🟢 Вставать в 5 утра — признак безумия.", "l": "🟢"}, {"n": 22, "t": "🟢 Бабушки у подъезда — лучшая система безопасности в мире.", "l": "🟢"}, {"n": 23, "t": "🟢 Курица появилась раньше яйца, и это доказ м), «Третий лишний». Два стула, «столик» с бокалами. Таймер.\n\n**Механика:**\n\n- Ведущий вызывает пару. Каждый тянет **1 Роль** (объявляет вслух) + **1 Манеру** + **1 Условие** (тайно).\n- **20 секунд подготовки.** Ведущий даёт завязку из колоды «Места свиданий».\n- **Сцена 3–5 минут.** Нельзя прямо назвать своё условие, его надо **играть**. Партнёр подыгрывает правилом «да, и…».\n- **Свопы по хлопку ведущего:** «Смена манер» (обмен манерами посреди фразы), «Смена ролей», «Перемотка» (сцена заново в 2 раза быстрее), «Немое кино» (30 секунд без слов).\n- **«Третий лишний»:** раз за сцену ведущий отправляет третьего игрока с картой. Он врывается на 60 секунд.\n- **Угадывание:** зал называет манеру и условие каждого актёра.\n- **Очки:** зритель: манера +1, условие +2. Актёр: +1 за каждого угадавшего его условие. Никто не угадал, −1 актёру.\n- **Эскалация:** 2 сцены 🟢 → 🟡 → 🔴.\n- **Конец:** «Пара вечера» (голосование) получает медленный танец под аплодисменты.\n- 🍷 Неугаданное условие, актёр пьёт. Зритель, уверенно назвавший неверное условие, тоже. Без алкоголя: проигравший повторяет последнюю реплику «самым сексуальным голосом».", "decks": [{"name": "Абсурдное свидание — Роли", "cards": [{"n": 1, "t": "🟢 Налоговый инспектор в отпуске", "l": "🟢"}, {"n": 2, "t": "🟢 Учительница начальной школы", "l": "🟢"}, {"n": 3, "t": "🟢 Космонавт, только что вернувшийся с МКС", "l": "🟢"}, {"n": 4, "t": "🟢 Свадебный фотограф", "l": "🟢"}, {"n": 5, "t": "🟢 Вампир, которому 600 лет", "l": "🟢"}, {"n": 6, "t": "🟢 Сантехник-философ", "l": "🟢"}, {"n": 7, "t": "🟢 Блогер-миллионник", "l": "🟢"}, {"n": 8, "t": "🟢 Шпион под прикрытием", "l": "🟢"}, {"n": 9, "t": "🟢 Фитнес-тренер", "l": "🟢"}, {"n": 10, "t": "🟢 Бывший участник реалити-шоу", "l": "🟢"}, {"n": 11, "t": "🟢 Министр сельского хозяйства", "l": "🟢"}, {"n": 12, "t": "🟢 Гадалка", "l": "🟢"}, {"n": 13, "t": "🟢 Пожарный, который боится огня", "l": "🟢"}, {"n": 14, "t": "🟢 Ветеринар для хомяков", "l": "🟢"}, {"n": 15, "t": "🟢 Дальнобойщик-поэт", "l "t": "🟢 Ты должен(на) вставить в разговор слово «бегемот» 5 раз.", "l": "🟢"}, {"n": 79, "t": "🟢 Ты скрываешь, что у тебя нет денег заплатить.", "l": "🟢"}, {"n": 80, "t": "🟢 Ты принимаешь партнёра за знаменитость.", "l": "🟢"}, {"n": 81, "t": "🟡 Ты влюблён(а) в официанта, а не в партнёра.", "l": "🟡"}, {"n": 82, "t": "🟡 Ты хочешь сделать предложение прямо сегодня.", "l": "🟡"}, {"n": 83, "t": "🟡 Ты ревнуешь партнёра к каждому, кто проходит мимо.", "l": "🟡"}, {"n": 84, "t": "🟡 У тебя одновременно свидание с двумя, и ты постоянно «отходишь».", "l": "🟡"}, {"n": 85, "t": "🟡 Это ваше пятое первое свидание: партнёр каждый раз всё забывает.", "l": "🟡"}, {"n": 86, "t": "🟡 Ты незаметно сравниваешь партнёра со своим бывшим.", "l": "🟡"}, {"n": 87, "t": "🟡 Ты хочешь поцеловать партнёра до конца сцены, но очень застенчив(а).", "l": "🟡"}, {"n": 88, "t": "🟡 Ты стесняешься, что сидишь без нижнего белья.", "l": "🟡"}, {"n": 89, "t": "🟡 Ты пытаешься понять, женат ли или замужем ли партнёр.", "l": "🟡"}, {"n": 90, "t": "🟡 Ты уже спланировал(а) вашу свадьбу и детей.", "l": "🟡"}, {"n": 91, "t": "🟡 Ты пытаешься расстаться прямо на первом свидании.", "l": "🟡"}, {"n": 92, "t": "🟡 Ты подослан(а) ревнивым бывшим партнёра.", "l": "🟡"}, {"n": 93, "t": "🔴 Ты пытаешься уговорить партнёра уйти к тебе домой до десерта.", "l": "🔴"}, {"n": 94, "t": "🔴 Ты втайне хочешь предложить тройничок с официантом.", "l": "🔴"}, {"n": 95, "t": "🔴 Ты сексолог и ставишь «диагноз» по каждой реплике.", "l": "🔴"}, {"n": 96, "t": "🔴 Ты уверен(а), что это свидание вслепую в свингер-клубе.", "l": "🔴"}, {"n": 97, "t": "🔴 Под столом ты «случайно» всё время касаешься ноги партнёра (только с согласия).", "l": "🔴"}, {"n": 98, "t": "🔴 Ты пытаешься выяснить любимую позу партнёра, не спрашивая прямо.", "l": "🔴"}, {"n": 99, "t": "🔴 Ты всё время намекаешь на наручники в сумке.", "l": "🔴"}, {"n": 100, "t": "🔴 Ты пишешь эротический роман и записываешь реплики партнёра для сцены.", "l": "🔴"}, {"n": 101, "t": "🔴 Ты очень возбуждён(а) от каждого слова партнёра о налогах.", "l": "🔴"}, {"n": 102, "t": "🔴 Ты проверяешь, умеет ли партнёр целоваться (по описанию).", "l": "🔴"}, {"n": 103, "t": "🔴 Ты пришёл(ла) на кастинг в эротический фильм и думаешь, что это прослушивание.", "l": "🔴"}, {"n": 104, "t": "🔴 Ты пытаешься незаметно снять с себя одну вещь за сцену.", "l": "🔴"}, {"n": 105, "t": "🔴 Ты хочешь узнать, громкий ли партнёр в постели.", "l": "🔴"}]}, {"name": "Абсурдное свидание — Места свиданий", "cards": [{"n": 106, "t": "Ресторан, первое свидание после переписки в Тиндере.", "l": ""}, {"n": 107, "t": "Очередь в МФЦ.", "l": ""}, {"n": 108, "t": "Колесо обозрения, которое застряло.", "l": ""}, {"n": 109, "t": "Похороны общего знакомого.", "l": ""}, {"n": 110, "t": "Космический корабль, летящий на Марс.", "l": ""}, {"n": 111, "t": "Кабинет стоматолога.", "l": ""}, {"n": 112, "t": "Свадьба бывшего.", "l": ""}, {"n": 113, "t": "Подводная лодка.", "l": ""}, {"n": 114, "t": "Отель «всё включено» в Турции.", "l": ""}, {"n": 115, "t": "Секс-шоп, где оба оказались случайно.", "l": ""}]}, {"name": "Абсурдное свидание — Третий лишний", "cards": [{"n": 116, "t": "🟢 Бывший(ая) одного из пары, который «просто мимо проходил».", "l": "🟢"}, {"n": 117, "t": "🟢 Официант, который хочет рассказать о своём стартапе.", "l": "🟢"}, {"n": 118, "t": "🟢 Мама одного из пары.", "l": "🟢"}, {"n": 119, "t": "🟢 Курьер с огромным букетом «не тому».", "l": "🟢"}, {"n": 120, "t": "🟡 Скрипач с серенадой не тому.", "l": "🟡"}, {"n": 121, "t": "🟡 Свидетель на свадьбе, перепутавший ресторан.", "l": "🟡"}, {"n": 122, "t": "🟡 Гадалка, предсказывающая этой паре 7 детей.", "l": "🟡"}, {"n": 123, "t": "🔴 Тайный любовник, у которого «тоже свидание здесь в 20:00».", "l": "🔴"}, {"n": 124, "t": "🔴 Аниматор из свингер-клуба с приглашением на двоих.", "l": "🔴"}, {"n": 125, "t": "🔴 Частный детектив, нанятый ревнивым супругом.", "l": "🔴"}]}]}], "info": [{"title": "Как пользоваться", "md": "- **Порядок:** «Кто скорее всего» (разогрев) → «Алиас / Крокодил» (команды и энергия) → «Пресс-секретарь» (покерфейс) → «Адвокат дьявола» (спор и абсурд) → «Абсурдное свидание» (кульминация-импровизация).\n- **Уровни:** 🟢 смешно для всех, 🟡 с перчинкой и про отношения, 🔴 18+. Красные карты подмешиваются, когда все «за».\n- **Кринж — это нормально.** Правило вечера: «чем неловче, тем лучше», но над человеком не смеёмся, смеёмся вместе.\n- **«Пас»** у каждого 3 раза, стоп-слово «Ананас».\n- **Алкоголь:** «глоток» = маленький глоток. Вода засчитывается. Для трезвых есть вариант с фантами (список ниже).\n- **Карточки для печати** в приложении в конце.\n\n**Универсальные фанты (вместо глотка):**\n\n- 10 приседаний с комментариями «я спортсмен»\n- Комплимент каждому игроку\n- Спеть припев любой песни голосом Пугачёвой\n- Сказать тост в стихах\n- 30 секунд говорить с акцентом, выбранным группой\n- Изобразить, как ты выглядишь на утро 1 января\n- Позвонить другу и сказать «я всё знаю» (и повесить трубку)\n- Танец маленьких утят с серьёзным лицом\n- Рассказать анекдот (плохой засчитывается)\n- 1 минуту отвечать на всё словами «так точно»"}, {"title": "Мини-сценарий (~1,5 часа)", "md": "| Время | Игра | Что происходит |\n|---|---|---|\n| 0:00–0:15 | «Кто скорее всего» (1) 🟢🟡 | Разогрев, первые титулы и звёзды |\n| 0:15–0:40 | «Алиас + Крокодил» (2) 🟢→🟡 | Команды, энергия, крик и смех |\n| 0:40–1:00 | «Пресс-секретарь» (3) 🟢→🟡 | Покерфейс, каждый на трибуне хотя бы раз |\n| 1:00–1:15 | «Адвокат дьявола» (4) 🟡, дуэли | Абсурдные и острые споры |\n| 1:15–1:30 | «Абсурдное свидание» (5) 🟢🟡, 3–4 сцены | Кульминация, «Пара вечера» |\n\n*Продолжение для поздней ночи: 🔴 раунд Алиаса или Крокодила, 🔴 пресс-конференция «по вопросам нравственности», 🔴 сцены «Абсурдного свидания».*"}]}, {"id": "x18", "title": "Финал 18+", "full": "Финал вечера 18+: от чувственного к групповому", "icon": "🔥", "intro": "*Пять игр для финала вечера в компании взрослых, которые **заранее и добровольно** договорились о взрослой вечеринке. Градус поднимается шаг за шагом: от взглядов и поцелуев к раздеванию, откровенным ласкам и групповой игре, а затем к свободной игре без карт. Всё строится на одном принципе: **только восторженное «да»**.*\n\n> **Только для взрослых (18+), только по взаимному согласию.** Никого нельзя уговаривать, «дожимать», ставить в неловкое положение перед группой. Наблюдать, а не участвовать, — полноправный вариант. Любое «нет» и «стоп» окончательны и не наказываются.", "games": [{"id": "x181", "title": "«Раздевание или глоток» (Strip or Sip, расширенная)", "short": "Раздевание или глоток", "rules": "**Суть:** открывающая игра финала. Тело постепенно открывается, а выбор, чем «платить», остаётся за игроком.\n\n**Подготовка:** колода заданий по уровням, кубик, вода и лёгкий напиток. Каждый объявляет количество своих «вещей» (аксессуары считаются по одному, носки парой). Минимум (например, «бельё остаётся до 🔥») объявляется заранее.\n\n**Механика:**\n\n- По кругу ходящий тянет карту и выполняет **или** платит: снимает одну вещь **или** делает глоток (воды или напитка).\n- **Кубик-модификатор** (по желанию): 1–2 выполняешь сам(а), 3–4 с соседом слева, 5 выбираешь партнёра сам(а), 6 выбирает группа.\n- **Партнёр для задания** может отказаться без штрафа, тогда выбирают другого.\n- **Возврат:** выполнил 2 задания подряд, можно вернуть одну вещь или назначить кому-то снять вещь (если тот согласен).\n- **Эскалация:** 🟡 первые 2 круга, 🔴 со 3-го. 🔥 открывается, когда все «в игре» показали 👍.\n- **Конец:** закончилась колода или все дошли до минимума. Тот, кто «самый одетый», выбирает первое задание в «Бутылочке».", "decks": [{"name": "Раздевание или глоток", "cards": [{"n": 1, "t": "🟡 Сделай комплимент телу каждого игрока, по одной фразе.", "l": "🟡"}, {"n": 2, "t": "🟡 30 секунд танцуй под песню, выбранную соседом.", "l": "🟡"}, {"n": 3, "t": "🟡 Изобрази стриптиз, снимая… часы или браслет.", "l": "🟡"}, {"n": 4, "t": "🟡 Расскажи, что на тебе сейчас надето под одеждой.", "l": "🟡"}, {"n": 5, "t": "🟡 Пройдись по комнате походкой «я Проведи пером по запястью и шее.", "l": "🟡"}, {"n": 4, "t": "🟡 Подуй на шею и за ухом.", "l": "🟡"}, {"n": 5, "t": "🟡 Шепни на ухо 3 слова, описывающих его.", "l": "🟡"}, {"n": 6, "t": "🟡 Проведи пальцами по линии его брови, носа, губ.", "l": "🟡"}, {"n": 7, "t": "🟡 Возьми его руки в свои и держи 30 секунд, дыша в унисон.", "l": "🟡"}, {"n": 8, "t": "🟡 Медленный танец: ведёшь ты, он вслепую.", "l": "🟡"}, {"n": 9, "t": "🟡 Поцелуй в лоб и щёки.", "l": "🟡"}, {"n": 10, "t": "🟡 Массаж ладоней с маслом 1 минуту.", "l": "🟡"}, {"n": 11, "t": "🟡 Проведи шёлковым платком по лицу и шее.", "l": "🟡"}, {"n": 12, "t": "🟡 Поцелуй тыльную сторону ладони, затем запястье, затем сгиб локтя.", "l": "🟡"}, {"n": 13, "t": "🟡 Ars Amandi: гладь его предплечья, глядя на него, 1 минуту.", "l": "🟡"}, {"n": 14, "t": "🟡 Положи его руку себе на щёку. Пусть угадает, кто ты, только по лицу.", "l": "🟡"}, {"n": 15, "t": "🟡 Покорми его шоколадом и не давай откусить сразу.", "l": "🟡"}, {"n": 16, "t": "🟡 Коснись губами его губ, без поцелуя.", "l": "🟡"}, {"n": 17, "t": "🟡 Проведи кистью по ключицам.", "l": "🟡"}, {"n": 18, "t": "🟡 Массаж кожи головы 1 минуту.", "l": "🟡"}, {"n": 19, "t": "🟡 Обними сзади и шепчи комплименты 30 секунд.", "l": "🟡"}, {"n": 20, "t": "🟡 Поцелуй 5 секунд. Пусть угадает, кто.", "l": "🟡"}, {"n": 21, "t": "🔴 Проведи кубиком льда по шее, ключицам, плечам.", "l": "🔴"}, {"n": 22, "t": "🔴 Поцелуй в шею 15 секунд.", "l": "🔴"}, {"n": 23, "t": "🔴 Сними с него одну вещь медленно, комментируя шёпотом.", "l": "🔴"}, {"n": 24, "t": "🔴 Поцелуй в 3 места выше пояса, пусть назовёт их по порядку.", "l": "🔴"}, {"n": 25, "t": "🔴 Масло на спину и массаж 1 минуту.", "l": "🔴"}, {"n": 26, "t": "🔴 Проведи губами по его руке от ладони до плеча.", "l": "🔴"}, {"n": 27, "t": "🔴 Целуй его ключицы и грудь.", "l": "🔴"}, {"n": 28, "t": "🔴 Передай губами кусочек шоколада.", "l": "🔴"}, {"n": 29, "t": "🔴 Оближи дольку клубники, потом поцелуй.", "l": "🔴"}, {"n": 30, "t": "🔴 Проведи пером по животу.", "l": "🔴"}, {"n": 31, "t": "🔴 Поцелуй по-французски 10 секунд. Угадай, кто.", "l": "🔴"}, {"n": 32, "t": "🔴 Целуй его живот вокруг пупка.", "l": "🔴"}, {"n": 33, "t": "🔴 Положи его руки себе на талию и медленно двигайся.", "l": "🔴"}, {"n": 34, "t": "🔴 Двое касаются одновременно: один шеи, другой рук. Угадай обоих.", "l": "🔴"}, {"n": 35, "t": "🔴 Поцелуй внутреннюю сторону запястья, затем шею, затем губы.", "l": "🔴"}, {"n": 36, "t": "🔴 Проведи кончиками пальцев по позвоночнику снизу вверх.", "l": "🔴"}, {"n": 37, "t": "🔴 Капни тёплым (не горячим!) маслом на плечо и разотри.", "l": "🔴"}, {"n": 38, "t": "🔴 Целуй его плечи, пока он не скажет «ещё» или «хватит».", "l": "🔴"}, {"n": 39, "t": "🔴 Сними с него вторую вещь, не используя рук.", "l": "🔴"}, {"n": 40, "t": "🔴 Проведи кубиком льда по груди, затем поцелуй это место.", "l": "🔴"}, {"n": 41, "t": "🔴 Ляг рядом, кожа к коже, 30 секунд тишины.", "l": "🔴"}, {"n": 42, "t": "🔴 Поцелуй бедро через одежду.", "l": "🔴"}, {"n": 43, "t": "🔴 Он лежит, ты целуешь его тело от шеи до пояса.", "l": "🔴"}, {"n": 44, "t": "🔴 Шепни, что ты сделаешь, если он скажет «да», и подожди ответа.", "l": "🔴"}, {"n": 45, "t": "🔴 Массаж стоп с маслом 1 минуту.", "l": "🔴"}, {"n": 46, "t": "🔴 Пусть он касается тебя вслепую 30 секунд и угадывает, кто ты.", "l": "🔴"}, {"n": 47, "t": "🔴 Поцелуй с паузами: подойди, остановись в сантиметре, отступи, повтори.", "l": "🔴"}, {"n": 48, "t": "🔴 Проведи пером по внутренней стороне бёдер (поверх белья).", "l": "🔴"}, {"n": 49, "t": "🔴 Двое шепчут ему в оба уха одновременно, что хотят с ним сделать.", "l": "🔴"}, {"n": 50, "t": "🔴 Ars Amandi: 2 минуты «страстной сцены» только руками, плечами и взглядом.", "l": "🔴"}, {"n": 51, "t": "🔥 Сними с него бельё (по согласию).", "l": "🔥"}, {"n": 52, "t": "🔥 Ласкай его руками 30 секунд.", "l": "🔥"}, {"n": 53, "t": "🔥 Лёд по груди и животу, затем тёплые губы.", "l": "🔥"}, {"n": 54, "t": "🔥 Целуй внутреннюю сторону бёдер.", "l": "🔥"}, {"n": 55, "t": "🔥 Оральные ласки 30 секунд (с защитой). Он угадывает, кто.", "l": "🔥"}, {"n": 56, "t": "🔥 Используй игрушку 30 секунд (в презервативе, по согласию).", "l": "🔥"}, {"n": 57, "t": "🔥 Масло и массаж интимных зон 1 минуту (по согласию).", "l": "🔥"}, {"n": 58, "t": "🔥 Чередуй лёд и тёплое дыхание на самых чувствительных местах.", "l": "🔥"}, {"n": 59, "t": "🔥 Двое: один целует губы, другой ласкает руками.", "l": "🔥"}, {"n": 60, "t": "🔥 Пусть он направляет твою руку туда, где ему приятнее всего.", "l": "🔥"}, {"n": 61, "t": "🔥 Ласкай его, пока он описывает свои ощущения вслух.", "l": "🔥"}, {"n": 62, "t": "🔥 Оральные ласки 1 минуту, он командует темпом.", "l": "🔥"}, {"n": 63, "t": "🔥 Покажи ему свои ощущения: возьми его руку и проведи по своему телу.", "l": "🔥"}, {"n": 64, "t": "🔥 Подведи его к кому-то третьему (с согласия третьего) и положи его руки ему на тело.", "l": "🔥"}, {"n": 65, "t": "🔥 Он лежит, ты двигаешься на нём через бельё 30 секунд.", "l": "🔥"}, {"n": 66, "t": "🔥 Взаимные ласки вслепую: у обоих повязки.", "l": "🔥"}, {"n": 67, "t": "🔥 Целуй его, пока кто-то другой ласкает его (если все согласны).", "l": "🔥"}, {"n": 68, "t": "🔥 Продолжите вдвоём в «будуаре» 5 минут.", "l": "🔥"}, {"n": 69, "t": "💞 «Слепой» в центре: трое касаются одновременно разных мест 1 минуту.", "l": "💞"}, {"n": 70, "t": "💞 Все в повязках, кроме ведущего. Медленно найдите друг друга руками (только руки и лица).", "l": "💞"}, {"n": 71, "t": "💞 «Слепой» целует по очереди троих и называет любимый поцелуй (не по имени, по номеру).", "l": "💞"}, {"n": 72, "t": "💞 Двое ласкают «слепого», третий шепчет ему на ухо.", "l": "💞"}, {"n": 73, "t": "💞 «Цепь»: все в повязках держатся за руки, каждый целует соседа справа.", "l": "💞"}, {"n": 74, "t": "💞 «Слепой» сам выбирает руками, кто останется с ним до следующего хода.", "l": "💞"}, {"n": 75, "t": "💞 Двое в повязках ласкают друг друга, остальные направляют их шёпотом.", "l": "💞"}, {"n": 76, "t": "💞 Тройка в повязках, ведущий выключает свет: 3 минуты свободной игры, затем свет.", "l": "💞"}, {"n": 77, "t": "💞 Лёд передаётся губами по кругу.", "l": "💞"}, {"n": 78, "t": "💞 Все, кто хочет, ложатся вместе. Повязки, тишина, касания, 2 минуты.", "l": "💞"}, {"n": 79, "t": "💞 «Слепой» говорит одно желание вслух. Тот, кто хочет его исполнить, исполняет.", "l": "💞"}, {"n": 80, "t": "💞 Повязки не снимаем: переход к свободной игре в полумраке.", "l": "💞"}]}]}, {"id": "x184", "title": "«Тайные миссии 18+» (на весь финал)", "short": "Тайные миссии 18+", "rules": "**Суть:** каждый втайне выполняет откровенные миссии **параллельно** с другими играми. Это создаёт фон флирта и подогревает весь финал.\n\n**Подготовка:** колода миссий по уровням, конверт ведущего, ручки. Раздать в начале финала каждому **по 1 карте каждого уровня**, на который он согласен по браслету (🟡 / 🔴 / 🔥 / 💞).\n\n**Механика:**\n\n- Миссии держат в тайне. Выполнил, пишешь время и отдаёшь ведущему. Можно тянуть новую того же уровня.\n- **Миссии с касанием** выполняются только с людьми, чей браслет это разрешает, и после их «да». «Тайна» — это цель, а не способ обойти согласие: спросить можно игриво.\n- **Разоблачение:** любой может сказать «Обвиняю!» и назвать миссию. Угадал, миссия сгорает, обвинитель +2, разоблачённый исполняет её открыто (если партнёр согласен) или снимает вещь. Ошибся, обвинитель снимает вещь или делает глоток.\n- **Очки:** 🟡 1, 🔴 2, 🔥 3, 💞 5.\n- **Конец:** ведущий зачитывает выполненные миссии. Победитель выбирает, кто первым начинает свободную игру с ним (если тот хочет).", "decks": [{"name": "Тайные миссии 18+", "cards": [{"n": 1, "t": "🟡 Получи поцелуй в щёку от трёх разных людей.", "l": "🟡"}, {"n": 2, "t": "🟡 Добейся, чтобы кто-то сам сел к тебе на колени.", "l": "🟡"}, {"n": 3, "t": "🟡 Подержи кого-то за талию 30 секунд под любым предлогом.", "l": "🟡"}, {"n": 4, "t": "🟡 Заставь кого-то покраснеть от твоего шёпота.", "l": "🟡"}, {"n": 5, "t": "🟡 Добейся, чтобы кто-то рассказал тебе свою фантазию.", "l": "🟡"}, {"n": 6, "t": "🟡 Узнай любимую позу у двух людей.", "l": "🟡"}, {"n": 7, "t": "🟡 Получи приглашение на медленный танец.", "l": "🟡"}, {"n": 8, "t": "🟡 Добейся, чтобы кто-то поцеловал тебе руку.", "l": "🟡"}, {"n": 9, "t": "🟡 Заставь кого-то сказать «я тебя хочу» (можно шутливо).", "l": "🟡"}, {"n": 10, "t": "🟡 Поцелуй кого-то в шею «случайно».", "l": "🟡"}, {"n": 11, "t": "🟡 Добейся, чтобы кто-то поправил на тебе одежду.", "l": "🟡"}, {"n": 12, "t": "🟡 Узнай, какое бельё на двух игроках.", "l": "🟡"}, {"n": 13, "t": "🟡 Сделай так, чтобы кто-то попросил тебя о массаже.", "l": "🟡"}, {"n": 14, "t": "🟡 Получи настоящий поцелуй в губы.", "l": "🟡"}, {"n": 15, "t": "🟡 Уговори кого-то поменяться с тобой вещью одежды.", "l": "🟡"}, {"n": 16, "t": "🟡 Добейся, чтобы кто-то назвал тебя «котик» или «зайка».", "l": "🟡"}, {"n": 17, "t": "🟡 Узнай чью-то эрогенную зону и проверь (с согласия).", "l": "🟡"}, {"n": 18, "t": "🟡 Добейся, чтобы двое других поцеловались.", "l": "🟡"}, {"n": 19, "t": "🟡 Получи комплимент твоему телу от трёх людей.", "l": "🟡"}, {"n": 20, "t": "🟡 Добейся, чтобы кто-то сказал «ещё».", "l": "🟡"}, {"n": 21, "t": "🔴 Сними с кого-то вещь, не попросив прямо.", "l": "🔴"}, {"n": 22, "t": "🔴 Добейся, чтобы кто-то снял вещь с тебя.", "l": "🔴"}, {"n": 23, "t": "🔴 Поцелуй кого-то в живот.", "l": "🔴"}, {"n": 24, "t": "🔴 Сделай кому-то массаж спины без одежды.", "l": "🔴"}, {"n": 25, "t": "🔴 Получи поцелуй в ключицу.", "l": "🔴"}, {"n": 26, "t": "🔴 Целуйся с кем-то не меньше 30 секунд.", "l": "🔴"}, {"n": 27, "t": "🔴 Добейся, чтобы кто-то коснулся твоей груди.", "l": "🔴"}, {"n": 28, "t": "🔴 Посиди на коленях лицом к кому-то минуту.", "l": "🔴"}, {"n": 29, "t": "🔴 Поцелуй троих в шею за 10 минут.", "l": "🔴"}, {"n": 30, "t": "🔴 Останься в одном белье и сделай вид, что «так и было».", "l": "🔴"}, {"n": 31, "t": "🔴 Уведи кого-то в «будуар» на 3 минуты.", "l": "🔴"}, {"n": 32, "t": "🔴 Добейся, чтобы кто-то поцеловал тебе внутреннюю сторону бедра.", "l": "🔴"}, {"n": 33, "t": "🔴 Проведи кубиком льда по чьему-то телу.", "l": "🔴"}, {"n": 34, "t": "🔴 Получи поцелуй от двух людей подряд.", "l": "🔴"}, {"n": 35, "t": "🔴 Добейся, чтобы кто-то назвал тебя самым сексуальным в комнате.", "l": "🔴"}, {"n": 36, "t": "🔴 Поцелуй кого-то, пока на вас смотрят все.", "l": "🔴"}, {"n": 37, "t": "🔴 Сними с двух разных людей по вещи.", "l": "🔴"}, {"n": 38, "t": "🔴 Добейся, чтобы кто-то лёг рядом с тобой.", "l": "🔴"}, {"n": 39, "t": "🔴 Получи засос (если не против следа) или поцелуй в шею на 10 секунд.", "l": "🔴"}, {"n": 40, "t": "🔴 Добейся, чтобы кто-то шепнул тебе, чего он хочет.", "l": "🔴"}, {"n": 41, "t": "🔴 Поцелуй кого-то в грудь.", "l": "🔴"}, {"n": 42, "t": "🔴 Добейся, чтобы кто-то разделся до белья ради тебя.", "l": "🔴"}, {"n": 43, "t": "🔴 Сделай кому-то приватный танец.", "l": "🔴"}, {"n": 44, "t": "🔴 Поцелуй с кем-то, у кого завязаны глаза.", "l": "🔴"}, {"n": 45, "t": "🔴 Добейся, чтобы кто-то сам предложил «продолжить позже».", "l": "🔴"}, {"n": 46, "t": "🔥 Ласкай кого-то руками через бельё 30 секунд.", "l": "🔥"}, {"n": 47, "t": "🔥 Сними с кого-то бельё (по согласию).", "l": "🔥"}, {"n": 48, "t": "🔥 Получи оральные ласки (по согласию, с защитой).", "l": "🔥"}, {"n": 49, "t": "🔥 Сделай кому-то оральные ласки (по согласию, с защитой).", "l": "🔥"}, {"n": 50, "t": "🔥 Используй игрушку на ком-то (в презервативе, по согласию).", "l": "🔥"}, {"n": 51, "t": "🔥 Займись сексом с кем-то в «будуаре» (по согласию, с защитой).", "l": "🔥"}, {"n": 52, "t": "🔥 Добейся, чтобы кто-то стонал от твоих ласк.", "l": "🔥"}, {"n": 53, "t": "🔥 Ласкай кого-то, пока вы целуетесь, 1 минуту.", "l": "🔥"}, {"n": 54, "t": "🔥 Попроси кого-то показать, как он ласкает себя, и посмотри (если он хочет).", "l": "🔥"}, {"n": 55, "t": "🔥 Сделай так, чтобы кто-то попросил тебя «не останавливаться».", "l": "🔥"}, {"n": 56, "t": "🔥 Поцелуй кого-то везде, где он разрешит.", "l": "🔥"}, {"n": 57, "t": "🔥 Сделай кому-то эротический массаж с маслом.", "l": "🔥"}, {"n": 58, "t": "🔥 Ласкай кого-то вслепую.", "l": "🔥"}, {"n": 59, "t": "🔥 Получи ласки от двух людей подряд.", "l": "🔥"}, {"n": 60, "t": "🔥 Проведи кому-то ледяной кубик по самым чувствительным местам.", "l": "🔥"}, {"n": 61, "t": "🔥 Попробуй с кем-то позу, которую ты ещё не пробовал(а).", "l": "🔥"}, {"n": 62, "t": "🔥 Займись чем-то откровенным, пока на тебя смотрят (по согласию всех).", "l": "🔥"}, {"n": 63, "t": "🔥 Выясни у кого-то, что доводит его до оргазма, и сделай это.", "l": "🔥"}, {"n": 64, "t": "🔥 Доведи кого-то до оргазма (с его восторженного «да»).", "l": "🔥"}, {"n": 65, "t": "🔥 Ласкай двоих одновременно руками.", "l": "🔥"}, {"n": 66, "t": "💞 Будь в тройке хотя бы 5 минут.", "l": "💞"}, {"n": 67, "t": "💞 Поцелуй двоих одновременно (тройной поцелуй).", "l": "💞"}, {"n": 68, "t": "💞 Ласкай кого-то вместе со вторым игроком.", "l": "💞"}, {"n": 69, "t": "💞 Будь «центром» для двоих и больше.", "l": "💞"}, {"n": 70, "t": "💞 Собери «цепочку» из четырёх людей, которые ласкают друг друга.", "l": "💞"}, {"n": 71, "t": "💞 Уговори пару принять тебя третьим (по согласию обоих).", "l": "💞"}, {"n": 72, "t": "💞 Займись сексом рядом с другой парой.", "l": "💞"}, {"n": 73, "t": "💞 Поменяйтесь партнёрами с другой парой (по согласию всех четверых).", "l": "💞"}, {"n": 74, "t": "💞 Организуй «круг массажа»: все массируют того, кто справа.", "l": "💞"}, {"n": 75, "t": "💞 Будь тем, кто начнёт свободную игру для всех.", "l": "💞"}]}]}, {"id": "x185", "title": "«Однорукий бандит» и «Колесо желаний» (кто, что, кому делает)", "short": "Однорукий бандит + Колесо желаний", "rules": "**Суть:** кубики решают **кто** что делает **кому**, **где**, **как** и **сколько**. «Колесо желаний» работает наоборот: каждый загадывает, что хочет **получить** сам. Это самая откровенная игра финала, идёт последней.\n\n**Подготовка:** 5 кубиков (или генератор случайных чисел), листок с номерами игроков 1–N (у 🔴 браслетов номер со звёздочкой, их кубики не выбирают для касаний), таблицы ниже, станция защиты.\n\n**Механика «Однорукий бандит»:**\n\n- Ходящий бросает: **Кто** (номер игрока), **Кому** (номер), **Что** (таблица уровня), **Где** (таблица мест на теле), **Как / сколько** (таблица манер).\n- Выпало «сам себе» или 🔴 браслет, перебросить. Действие выполняется **только после «да» обоих**. Если кто-то против, перебросить «что».\n- **Уровни:** каждые 8 бросков переход к следующей таблице «Что» (🟡 → 🔴 → 🔥 → 💞). Таблицу можно вернуть назад по «тормозу».\n- **Джекпот:** выпали все одинаковые числа, ходящий сам выбирает любое действие из 🔥/💞 с согласным партнёром.\n- 🍷 Отказ, глоток воды или вещь.\n\n**Механика «Колесо желаний»:**\n\n- Каждый пишет 2–3 желания **к себе** («хочу, чтобы меня…»), подписывает номером и бросает в шапку.\n- Ход: вытянуть желание и бросить кубик на исполнителя. Исполнитель может передать желание тому, кто хочет его исполнить.\n- Желание исполняется сразу или в «будуаре».", "decks": [{"name": "Бандит — Что (🟡 чувственно)", "cards": [{"n": 1, "t": "🟡 Целует в губы", "l": "🟡"}, {"n": 2, "t": "🟡 Целует в шею", "l": "🟡"}, {"n": 3, "t": "🟡 Обнимает и шепчет комплимент", "l": "🟡"}, {"n": 4, "t": "🟡 Делает массаж", "l": "🟡"}, {"n": 5, "t": "🟡 Гладит", "l": "🟡"}, {"n": 6, "t": "🟡 Целует руку от пальцев до плеча", "l": "🟡"}, {"n": 7, "t": "🟡 Садится на колени", "l": "🟡"}, {"n": 8, "t": "🟡 Танцует медленный танец", "l": "🟡"}, {"n": 9, "t": "🟡 Кормит фруктом с губ", "l": "🟡"}, {"n": 10, "t": "🟡 Дует и целует", "l": "🟡"}, {"n": 11, "t": "🟡 Проводит пером", "l": "🟡"}, {"n": 12, "t": "🟡 Смотрит в глаза в 1 см, не целуя", "l": "🟡"}]}, {"name": "Бандит — Что (🔴 тело)", "cards": [{"n": 13, "t": "🔴 Снимает одну вещь", "l": "🔴"}, {"n": 14, "t": "🔴 Целует по-французски", "l": "🔴"}, {"n": 15, "t": "🔴 Проводит кубиком льда", "l": "🔴"}, {"n": 16, "t": "🔴 Целует и облизывает", "l": "🔴"}, {"n": 17, "t": "🔴 Делает массаж с маслом", "l": "🔴"}, {"n": 18, "t": "🔴 Раздевает до белья", "l": "🔴"}, {"n": 19, "t": "🔴 Нежно кусает", "l": "🔴"}, {"n": 20, "t": "🔴 Ложится сверху и целует", "l": "🔴"}, {"n": 21, "t": "🔴 Даёт приватный танец", "l": "🔴"}, {"n": 22, "t": "🔴 Целует кожу под бельём", "l": "🔴"}, {"n": 23, "t": "🔴 Гладит под одеждой", "l": "🔴"}, {"n": 24, "t": "🔴 Снимает вещь зубами", "l": "🔴"}]}, {"name": "Бандит — Что (🔥 откровенно)", "cards": [{"n": 25, "t": "🔥 Ласкает рукой", "l": "🔥"}, {"n": 26, "t": "🔥 Делает оральные ласки (с защитой)", "l": "🔥"}, {"n": 27, "t": "🔥 Снимает бельё", "l": "🔥"}, {"n": 28, "t": "🔥 Использует игрушку (в презервативе)", "l": "🔥"}, {"n": 29, "t": "🔥 Ласкает с маслом", "l": "🔥"}, {"n": 30, "t": "🔥 Чередует лёд и губы", "l": "🔥"}, {"n": 31, "t": "🔥 Ласкает, пока целует", "l": "🔥"}, {"n": 32, "t": "🔥 Ласкает вслепую", "l": "🔥"}, {"n": 33, "t": "🔥 Двигается на партнёре через бельё", "l": "🔥"}, {"n": 34, "t": "🔥 Ласкает, пока партнёр командует", "l": "🔥"}, {"n": 35, "t": "🔥 Показывает любимую позу (в белье или без, по согласию)", "l": "🔥"}, {"n": 36, "t": "🔥 Уводит в «будуар» на 5 минут", "l": "🔥"}]}, {"name": "Бандит — Что (💞 групповое)", "cards": [{"n": 37, "t": "💞 Вместе с соседом справа ласкают «Кому»", "l": "💞"}, {"n": 38, "t": "💞 «Кому» ложится, все желающие целуют его тело", "l": "💞"}, {"n": 39, "t": "💞 Тройной поцелуй с выбранным третьим", "l": "💞"}, {"n": 40, "t": "💞 «Кто» и «Кому» выбирают третьего и уходят в «будуар»", "l": "💞"}, {"n": 41, "t": "💞 Цепочка ласк: каждый ласкает соседа", "l": "💞"}, {"n": 42, "t": "💞 «Кто» становится «центром» для двоих", "l": "💞"}, {"n": 43, "t": "💞 Обмен партнёрами между двумя парами (по согласию всех)", "l": "💞"}, {"n": 44, "t": "💞 Двое ласкают «Кому», третий целует", "l": "💞"}, {"n": 45, "t": "💞 Все желающие ложатся вместе на 3 минуты", "l": "💞"}, {"n": 46, "t": "💞 «Кому» загадывает, что хочет от группы", "l": "💞"}, {"n": 47, "t": "💞 «Кто» ведёт «Кому» в центр, остальные смотрят или присоединяются", "l": "💞"}, {"n": 48, "t": "💞 Джекпот-свобода: свет гаснет, свободная игра для всех", "l": "💞"}]}, {"name": "Бандит — Где (место на теле)", "cards": [{"n": 49, "t": "Губы", "l": ""}, {"n": 50, "t": "Шея и уши", "l": ""}, {"n": 51, "t": "Ключицы и плечи", "l": ""}, {"n": 52, "t": "Запястья и ладони", "l": ""}, {"n": 53, "t": "Спина и позвоночник", "l": ""}, {"n": 54, "t": "Грудь", "l": ""}, {"n": 55, "t": "Живот", "l": ""}, {"n": 56, "t": "Бёдра (внутренняя сторона)", "l": ""}, {"n": 57, "t": "Ступни и щиколотки", "l": ""}, {"n": 58, "t": "Ягодицы", "l": ""}, {"n": 59, "t": "Интимные зоны (только 🔥 и выше)", "l": ""}, {"n": 60, "t": "Где выберет «Кому»", "l": ""}]}, {"name": "Бандит — Как и сколько", "cards": [{"n": 61, "t": "Медленно, 15 секунд", "l": ""}, {"n": 62, "t": "Медленно, 30 секунд", "l": ""}, {"n": 63, "t": "С закрытыми глазами, 30 секунд", "l": ""}, {"n": 64, "t": "Под счёт группы до 20", "l": ""}, {"n": 65, "t": "Пока «Кому» не скажет «ещё» или «хватит»", "l": ""}, {"n": 66, "t": "Шёпотом рассказывая, что делаешь, 30 секунд", "l": ""}, {"n": 67, "t": "Под одну песню", "l": ""}, {"n": 68, "t": "С повязкой на глазах у «Кому», 45 секунд", "l": ""}, {"n": 69, "t": "Пока группа молча смотрит, 30 секунд", "l": ""}, {"n": 70, "t": "С паузами: 5 секунд да, 5 секунд нет, 1 минута", "l": ""}, {"n": 71, "t": "Как «Кому» любит: он командует темпом, 1 минута", "l": ""}, {"n": 72, "t": "Без ограничения: до следующего хода", "l": ""}]}, {"name": "Колесо желаний — примеры («Хочу, чтобы меня…»)", "cards": [{"n": 73, "t": "🟡 …медленно поцеловали в шею.", "l": "🟡"}, {"n": 74, "t": "🟡 …обняли сзади и шептали на ухо.", "l": "🟡"}, {"n": 75, "t": "🟡 …раздели взглядом, а потом руками.", "l": "🟡"}, {"n": 76, "t": "🟡 …кормили клубникой.", "l": "🟡"}, {"n": 77, "t": "🟡 …гладили по волосам, пока целуют.", "l": "🟡"}, {"n": 78, "t": "🔴 …раздели до белья под музыку.", "l": "🔴"}, {"n": 79, "t": "🔴 …целовали везде выше пояса.", "l": "🔴"}, {"n": 80, "t": "🔴 …сделали массаж с маслом.", "l": "🔴"}, {"n": 81, "t": "🔴 …целовали двое одновременно.", "l": "🔴"}, {"n": 82, "t": "🔴 …ласкали с завязанными глазами.", "l": "🔴"}, {"n": 83, "t": "🔴 …провели льдом по всему телу.", "l": "🔴"}, {"n": 84, "t": "🔴 …удивили (сюрприз от исполнителя в рамках браслета).", "l": "🔴"}, {"n": 85, "t": "🔥 …ласкали руками, пока я целуюсь с кем-то другим.", "l": "🔥"}, {"n": 86, "t": "🔥 …ласкали ртом (с защитой).", "l": "🔥"}, {"n": 87, "t": "🔥 …использовали на мне игрушку.", "l": "🔥"}, {"n": 88, "t": "🔥 …довели до оргазма.", "l": "🔥"}, {"n": 89, "t": "🔥 …взяли инициативу и вели (в пределах моего браслета).", "l": "🔥"}, {"n": 90, "t": "🔥 …смотрели на меня, пока я ласкаю себя.", "l": "🔥"}, {"n": 91, "t": "💞 …ласкали двое одновременно.", "l": "💞"}, {"n": 92, "t": "💞 …положили в центр, и все желающие касались меня.", "l": "💞"}, {"n": 93, "t": "💞 …взяли третьим в пару.", "l": "💞"}, {"n": 94, "t": "💞 …пригласили в групповую игру первым(ой).", "l": "💞"}, {"n": 95, "t": "💞 …чтобы мы все легли вместе и не спешили.", "l": "💞"}]}], "mode": "bandit"}], "info": [{"title": "Переход к свободной игре", "md": "Игры — это трамплин. В какой-то момент карты мешают, и компания готова играть без правил. Сделайте этот переход **явным**, а не случайным.\n\n- **Сигнал:** ведущий объявляет: «Игра окончена. Дальше — свободная игра для тех, кто хочет. Кто устал или хочет смотреть, у вас зона отдыха».\n- **Повторная проверка:** все ещё раз смотрят на свои браслеты и меняют их, если нужно. Пары обмениваются взглядом или сигналом «ок».\n- **Зоны:**\n  - **Игровая зона:** матрасы, пледы, станция защиты, полумрак.\n  - **Зона отдыха и наблюдения:** диван, вода, еда, обычный свет.\n  - **Душ и ванная** со свободным доступом.\n- **Правила свободной игры:**\n  - Приглашение словами («хочешь присоединиться?»), ответ словами или кивком. Молчание — это не «да».\n  - Присоединиться к паре или группе можно, только спросив **всех** участников.\n  - Новый презерватив на каждого партнёра. Смена при переходе.\n  - «Стоп», «тормоз» и «ок?» продолжают работать. Ведущий остаётся «спасателем» и не участвует, или участвует, передав роль второму трезвому человеку.\n  - Можно в любой момент перейти в зону отдыха, вернуться, уйти домой.\n- **Музыка и свет:** длинный плейлист без пауз (2 часа, медленный R&B, даунтемпо), без верхнего света, свечи (LED)."}, {"title": "Забота после (aftercare)", "md": "- **Сразу после:** вода, фрукты и что-нибудь сладкое, пледы, тёплый чай. Душ. Тихая музыка, свет мягче.\n- **Объятия и разговор:** с теми, с кем были ближе всего: «как ты?», «что было самым приятным?», «что-то было не так?». Сказать «спасибо».\n- **Пары:** отдельный разговор вдвоём, лучше на следующий день трезвыми: что понравилось, что задело, что в следующий раз иначе.\n- **«Эмоциональный откат»** (drop) на 1–3 день — нормально: усталость, тревога, грусть. Помогают сон, еда, разговор, сообщение от друзей.\n- **На следующий день:** ведущий пишет в общий чат «все ок?» без подробностей и отдельно лично тем, кто был тише обычного.\n- **Конфиденциальность навсегда:** кто был, что было, с кем — не обсуждается вне компании.\n- **Если что-то пошло не так** (нарушение границы, ощущение давления): поговорить с ведущим, извиниться без оправданий, исключить повторение. Здоровье важнее неловкости: при разрыве презерватива принять экстренную контрацепцию и/или обратиться к врачу за ПКП (постконтактная профилактика ВИЧ) в первые 72 часа и сдать тесты."}, {"title": "Мини-сценарий финала (~1–1,5 часа)", "md": "| Время | Блок | Что происходит |\n|---|---|---|\n| 0:00–0:10 | Калибровка | Опрос «в игре / смотрю / отдыхаю», браслеты, линии и вуали, договорённости пар, станции защиты, раздача «Тайных миссий» (4) |\n| 0:10–0:25 | «Раздевание или глоток» (1) | 🟡 → 🔴: тела открываются, смех ещё есть |\n| 0:25–0:45 | «Бутылочка 18+» (2) | 🔴 → 🔥 по общему 👍 |\n| 0:45–1:05 | «Слепое касание» (3) | 🔴 → 🔥 → 💞, повязки, полумрак |\n| 1:05–1:20 | «Однорукий бандит» / «Колесо желаний» (5) | 🔥 → 💞, итоги тайных миссий |\n| 1:20 | Переход | Финальная карта, свет гаснет, свободная игра для желающих |\n| потом | Забота после | Вода, душ, объятия, «все ок?» на следующий день |"}], "before": {"title": "Перед игрой: обязательная подготовка", "md": "### 1. Согласие заранее (opt-in)\n\n- Формат «взрослой вечеринки с возможным групповым сексом» обсуждается с **каждым гостем заранее и лично**, не сюрпризом в тот же вечер. Приглашаются только те, кто сказал «да, мне интересно».\n- В начале финала ведущий ещё раз спрашивает каждого: «Ты в игре, наблюдаешь или идёшь отдыхать?» Ответ можно поменять в любой момент.\n\n### 2. Калибровка (10 минут, трезвыми)\n\n- Каждый тайно пишет ведущему свои **«линии»** (чего не будет со мной никогда) и **«вуали»** (что возможно, но не напоказ). Ведущий учитывает их, не называя имён.\n- **Браслеты или ленты на руку:**\n  - 🟢 **Зелёный:** «со мной можно всё из колод, включая 🔥 и 💞, но всё равно спрашивай».\n  - 🟡 **Жёлтый:** «поцелуи, касания, раздевание до белья. Откровенные ласки — только если спросишь отдельно и я скажу \"да\"».\n  - 🔴 **Красный:** «я смотрю и играю в задания без касаний».\n  - ⚪ **Белый узел на браслете:** «только со своим партнёром».\n- Браслет можно сменить в любой момент, и это нормально.\n\n### 3. Пары\n\n- Пары договариваются **до** вечера, не во время: можно ли с другими, что именно, что только вместе, что «наше».\n- Сигнал паре «давай отойдём поговорить» (например, сжать руку дважды) выполняется сразу, без обид.\n\n### 4. Безопасный секс и гигиена\n\n- **Станция у каждой зоны:** презервативы разных размеров, латексные салфетки (для орального секса), лубрикант на водной основе, салфетки, полотенца, мусорное ведро, вода.\n- **Новый презерватив на каждого партнёра и каждый вид контакта.** Игрушки только в презервативе, со сменой между людьми.\n- Заранее обсудить тесты на ИППП, контрацепцию и аллергии (латекс!).\n- Душ и чистые полотенца доступны. Ногти подстрижены, руки вымыты.\n\n### 5. Алкоголь: «почти трезвые»\n\n- Перед финалом максимум 2 порции за вечер. В 🔥 и 💞 уровнях **не участвует никто заметно пьяный**: ведущий вправе сказать «ты сегодня смотришь».\n- Ведущий трезв. Вода, лёд, фрукты всегда на столе. «Глоток» в играх можно заменить водой или фантом.\n\n### 6. Сигналы во время игры\n\n- **«Ананас» / скрещённые руки** — полный стоп, свет включается, все проверяют друг друга.\n- **«Тормоз» / ладони вперёд** — сбавить темп или вернуться на шаг назад.\n- **Проверка «ок?»:** знак «ОК» партнёру. Ответы: 👍 продолжаем, ✋ сбавляем, 👎 стоп.\n- **«Спроси — услышь — делай»:** любое касание из задания начинается с вопроса **конкретному человеку** («можно?») и только после его «да».\n- **Без фото и видео.** Телефоны в корзине.\n\n### Уровни карточек в этом документе\n\n- 🟡 **Чувственно:** взгляды, шёпот, поцелуи, касания поверх одежды.\n- 🔴 **Раздевание и тело:** раздевание, поцелуи в тело, массаж, касания кожи.\n- 🔥 **Откровенно:** ласки руками и ртом, интимные зоны, игрушки, всё с защитой и по согласию.\n- 💞 **Групповое:** задания для троих и больше, переход к свободной игре.\n\n---"}}];

function inl(s){s=esc(s);return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
 const L=src.split('\n');let h='',i=0;
 while(i<L.length){let l=L[i];
  if(!l.trim()){i++;continue}
  if(/^---+\s*$/.test(l)){h+='<hr>';i++;continue}
  let m=l.match(/^(#{1,6})\s+(.*)/);if(m){const n=Math.min(4,Math.max(3,m[1].length));h+=`<h${n}>${inl(m[2])}</h${n}>`;i++;continue}
  if(l.startsWith('>')){let b=[];while(i<L.length&&L[i].startsWith('>')){b.push(L[i].replace(/^>\s?/,''));i++}h+='<blockquote>'+md(b.join('\n'))+'</blockquote>';continue}
  if(l.startsWith('|')){let r=[];while(i<L.length&&L[i].startsWith('|')){r.push(L[i]);i++}
   const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
   let t='<div class="tw"><table>';r.forEach((x,k)=>{if(/^\|?\s*:?-+/.test(x.replace(/\|/g,'').trim()?x:'')&&/^[\s|:-]+$/.test(x))return;const tg=k==0?'th':'td';t+='<tr>'+cells(x).map(c=>`<${tg}>${inl(c)}</${tg}>`).join('')+'</tr>'});h+=t+'</table></div>';continue}
  if(/^\s*([-*]|\d+\.)\s/.test(l)){let b=[];while(i<L.length&&(/^\s*([-*]|\d+\.)\s/.test(L[i])||(/^\s{2,}\S/.test(L[i]))))
   {b.push(L[i]);i++}h+=list(b);continue}
  let p=[];while(i<L.length&&L[i].trim()&&!/^(#|>|\||---|\s*([-*]|\d+\.)\s)/.test(L[i])){p.push(L[i]);i++}
  h+='<p>'+inl(p.join(' '))+'</p>';}
 return h}
function list(b){const ind=b[0].match(/^\s*/)[0].length;const ol=/^\s*\d+\./.test(b[0]);let h=ol?'<ol>':'<ul>',cur=null,sub=[];
 const flush=()=>{if(cur!==null){h+='<li>'+inl(cur)+(sub.length?list(sub):'')+'</li>'}sub=[]};
 for(const l of b){const n=l.match(/^\s*/)[0].length;if(n<=ind&&/^\s*([-*]|\d+\.)\s/.test(l)){flush();cur=l.replace(/^\s*([-*]|\d+\.)\s+/,'')}else if(/^\s*([-*]|\d+\.)\s/.test(l))sub.push(l);else cur+=' '+l.trim()}
 flush();if(ol){const s=b[0].match(/\d+/)[0];if(s!='1')h=h.replace('<ol>',`<ol start="${s}">`)}return h+(ol?'</ol>':'</ul>')}

function st(g){return LS.get('g_'+g.id,null)||{drawn:[],decks:g.mode==='bandit'?['bandit']:[0],levels:null,players:0}}

function levelsOf(cards){return [...new Set(cards.map(c=>c.l).filter(Boolean))].sort((a,b)=>'🟢🟡🔴🔥💞'.indexOf(a)-'🟢🟡🔴🔥💞'.indexOf(b))}
function pool(g,s){let c;if(g.mode==='bandit'){if(s.decks[0]==='wheel')c=g.decks.filter(d=>d.name.startsWith('Колесо')).flatMap(d=>d.cards);else c=g.decks.filter(d=>d.name.startsWith('Бандит — Что')).flatMap(d=>d.cards)}
 else c=s.decks.flatMap(i=>g.decks[i]?g.decks[i].cards:[]);
 const lv=levelsOf(c);if(s.levels&&lv.length>1)c=c.filter(x=>!x.l||s.levels.includes(x.l));return {all:c,lv}}
function cards(g){const s=st(g),p=pool(g,s),left=p.all.filter(c=>!s.drawn.includes(c.uid));

 if(g.mode==='bandit'){h+='<div class="lbl">Режим</div><div class="chips">'+[['bandit','🎰 Однорукий бандит'],['wheel','🎡 Колесо желаний']].map(([k,t])=>`<button class="chip ${s.decks[0]===k?'on':''}" onclick="setDeck('${g.id}','${k}')">${t}</button>`).join('')+'</div>';
  if(s.decks[0]==='bandit')h+=`<div class="lbl">Кто → Кому (необязательно)</div><div class="chips" style="align-items:center">Игроков: <input class="num" type="number" inputmode="numeric" min="0" max="40" value="${s.players||''}" placeholder="выкл" onchange="setPlayers('${g.id}',this.value)"><span class="muted">0 / пусто — без номеров</span></div>`}
 else if(g.decks.length>1){h+='<div class="lbl">Колоды (можно несколько)</div><div class="chips">'+g.decks.map((d,i)=>`<button class="chip ${s.decks.includes(i)?'on':''}" onclick="togDeck('${g.id}',${i})">${esc(d.name.replace(/^[^—]*—\s*/,''))} · ${d.cards.length}</button>`).join('')+'</div>'}
 if(p.lv.length>1){const on=s.levels||p.lv;h+='<div class="lbl">Уровни</div><div class="chips">'+p.lv.map(l=>`<button class="chip ${on.includes(l)?'on':''}" onclick="togLv('${g.id}','${l}')">${l} ${LVN[l]}</button>`).join('')+'</div>'}
 h+=`<div class="drawzone"><div class="deckpile"><i></i><i></i><i>${g.sec.icon}</i></div><div class="count">Осталось <b>${left.length}</b> из ${p.all.length}</div></div>`;
 h+=`<div class="row"><button class="btn sec2" onclick="resetG('${g.id}')">↺ Сбросить колоду</button><button class="btn sec2" onclick="go('#/g/${g.id}')">📖 Правила</button></div></div>`;
 h+=`<div class="cta"><button class="btn bigdraw" onclick="draw('${g.id}')">${left.length||!p.all.length?'Взять карточку':'Перемешать и начать заново'}</button></div>`;app.innerHTML=h}
function upd(id,f){const g=GAMES[id],s=st(g);f(s,g);save(g,s);cards(g)}

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function draw(id){const g=GAMES[id],s=st(g),p=pool(g,s);if(!p.all.length){toast('Выберите колоду');return}
 let left=p.all.filter(c=>!s.drawn.includes(c.uid));
 if(!left.length){if(!confirm('Колода закончилась. Перемешать заново?'))return;const ids=p.all.map(c=>c.uid);s.drawn=s.drawn.filter(u=>!ids.includes(u));save(g,s);cards(g);toast('Перемешано');return}
 const c=rnd(left);s.drawn.push(c.uid);save(g,s);
