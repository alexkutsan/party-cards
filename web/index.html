<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Карточки для игр компанией. Ведущий показывает QR-код, текст открывается только на телефоне игрока.">
<title>Игры для компании</title>
<base href="__BASE__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=__HASH__">
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-scroll">
    <p class="eyebrow" id="sheetGame"></p>
    <h2 id="sheetTitle">Покажите код игроку</h2>
    <p class="sheet-lead">На этом экране текста карточки нет.</p>
    <div class="qrframe" id="qr"></div>
    <p class="hint">Игрок наводит камеру своего телефона. Если код не читается — прибавьте яркость.</p>
    <p class="count" id="sheetCount"></p>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="copyLink">Скопировать ссылку</button>
      <a class="btn ghost" id="openTab" target="_blank" rel="noopener">Открыть в новой вкладке</a>
    </div>
  </div>
  <button type="button" class="btn sheet-close" id="closeSheet">Закрыть / следующий</button>
</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">Чтобы раздать карточки, включите JavaScript. Код строится на телефоне ведущего, без внешних сервисов.</p></noscript>
<script src="vendor/qrcode.js?v=__HASH__"></script>
<script src="data.js?v=__HASH__"></script>
<script src="app.js?v=__HASH__"></script>
<script>
if ('serviceWorker' in navigator) {
  var host = location.hostname;
  var local = host === 'localhost' || host === '127.0.0.1';
  var force = location.search.indexOf('sw=1') !== -1;
  if (!local || force) {
    var root = document.querySelector('base').href;
    navigator.serviceWorker.register(new URL('sw.js?v=__HASH__', root).href).catch(function () {});
  }
}
</script>
</body>
</html>
